# Build JitPack (https://jitpack.io/#Eternom/EterLib)
# Gradle tourne sur Java 21 ; le JDK 25 demandé par le projet (toolchain) est téléchargé
# automatiquement grâce au plugin foojay déclaré dans settings.gradle.kts.
# Gradle est téléchargé directement depuis gradle.org : gradle-wrapper.jar s'est révélé illisible
# dans l'environnement JitPack (build 1.1.0) et l'archive fournie par SDKMan y arrive souvent
# corrompue (builds 1.3.0 et 1.4.0).
jdk:
  - openjdk21
before_install:
  - curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
  - unzip -q -o /tmp/gradle.zip -d /tmp
install:
  - /tmp/gradle-9.7.1/bin/gradle publishToMavenLocal
