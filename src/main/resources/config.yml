# ============================================================
#  EterLib : configuration commune à tous les plugins Eter
# ============================================================
#
#  Serveur, base de données, Redis, téléportation, langue et couleurs se
#  règlent ICI une seule fois, pour EterHome, EterEssential, EterJob...
#  Chaque plugin n'a plus dans sa propre config que ses réglages à lui.
#  Toute modification nécessite un redémarrage du serveur.

# ============================================================
#  Serveur
# ============================================================
#
#  Nom de CE serveur, EXACTEMENT comme dans la config du proxy
#  (section [servers] de velocity.toml, ou "servers" de BungeeCord).
#  Différent sur chaque serveur. Sert à savoir où sont les joueurs
#  et les homes, et à y envoyer les joueurs.

server-name: ''

# Nom de CE serveur tel que les joueurs le voient, ex : "Survie". Le seul endroit
# où le régler : tous les plugins Eter (chat, sidebar, homes...) l'utilisent,
# depuis tous les serveurs, et il est transmis au proxy (liste Tab d'EterTab).
# Vide : server-name est utilisé.
server-display-name: ''

# Messages « X a rejoint la partie » / « X a quitté la partie » de Minecraft sur CE serveur.
# false (conseillé en réseau) : coupés, c'est le proxy (EterVelocityLobby) qui annonce une seule fois
# l'arrivée et le départ du RÉSEAU, pas chaque changement de serveur.
vanilla-join-quit-messages: false

# ============================================================
#  Base de données (MySQL ou MariaDB)
# ============================================================
#
#  Ces infos te sont données par ton hébergeur (ex : onglet
#  "Databases" sur Pterodactyl) ou ton admin.
#  MySQL ou MariaDB est détecté automatiquement à la connexion.
#
#  Tous les serveurs du réseau pointent vers la même base. Chaque plugin
#  y a ses propres tables, préfixées par son nom (eter_players,
#  eterhome_homes...) : aucun conflit possible, et un site web peut tout lire.

database:
  # Adresse du serveur de base de données.
  # "localhost" si la base tourne sur la même machine que Minecraft.
  host: localhost

  # Port du serveur de base de données (3306 par défaut).
  port: 3306

  # Nom de la base. Elle doit déjà exister : les plugins créent les tables,
  # pas la base elle-même (ex : CREATE DATABASE eternom;).
  name: eternom

  # Identifiants d'un utilisateur ayant les droits sur cette base.
  # Évite "root" en production : crée un utilisateur dédié.
  username: root
  password: ''

  # Nombre max de connexions ouvertes en même temps, partagées par tous les plugins Eter (au repos : 2).
  # 10 suffit largement. Attention : la base a une limite pour TOUT le réseau (max_connections, 151 par
  # défaut) : pool-size × nombre de serveurs, + LuckPerms de chaque serveur, doit rester en dessous.
  pool-size: 10

# ============================================================
#  Cache (Redis)
# ============================================================
#
#  Redis est OBLIGATOIRE, le même pour tous les serveurs du réseau : il sait qui est
#  connecté où, porte les messages entre serveurs (chat, /tpa...), les délais et les
#  verrous d'EterSync. La base de données reste toujours la source de vérité.
#  Injoignable au démarrage : EterLib (et donc tous les plugins Eter) ne démarre pas.

cache:
  # Adresse et port du serveur Redis ("localhost" si même machine, port par défaut 6379).
  host: localhost
  port: 6379

  # Mot de passe Redis, laisser vide s'il n'y en a pas.
  password: ''

  # Numéro de base Redis (0 à 15). Laisser 0 sauf si ton admin t'en attribue une autre.
  database: 0

  # Préfixe ajouté à toutes les clés, pour ne pas mélanger avec d'autres programmes
  # utilisant le même Redis. Identique sur tous les serveurs du réseau.
  prefix: 'eter:'

  # Secret des messages entre serveurs (chat, votes, sanctions, annonces...) : chacun est signé avec lui, et un message
  # non signé, mal signé ou vieux de plus de 2 minutes est ignoré. LE MÊME sur tous les serveurs du réseau (et dans le
  # modèle de config des lobbys de l'orchestrateur). Une longue chaîne au hasard, ex : openssl rand -hex 32.
  # Vide : messages non signés (ancien fonctionnement).
  secret: ''

  # Nombre max de connexions ouvertes en même temps vers Redis. 8 suffit largement.
  pool-size: 8

# ============================================================
#  Téléportation (commune : /home, /tpa, /spawn...)
# ============================================================
#
#  Les mêmes règles pour toutes les téléportations : impossible d'enchaîner
#  /home et /tpa pour contourner un cooldown ou fuir un combat.
#  Les durées sont en secondes ; 0 désactive la règle.
#  Les permissions eter.bypass.warmup / .cooldown / .combat (op par défaut)
#  dispensent de chaque règle.

# Règles de jeu appliquées à CHAQUE monde de ce serveur, au démarrage et à chaque monde chargé : les lobbys créés par
# l'orchestrateur les ont d'office. Noms de Minecraft 26, ceux de /gamerule (ex : locator_bar, keep_inventory) ;
# true/false ou un nombre. Section absente : locator_bar false. Ne pas y mettre players_sleeping_percentage : EterSleep la gère.
game-rules:
  # Barre de localisation (direction des autres joueurs) : coupée. Elle trahit les bases, et ses paquets font planter
  # certains clients (ClientWaypointManager).
  locator_bar: false

# Activité des joueurs (temps de jeu actif, XP du pass, sommeil...) : un joueur qui n'a ni marché, ni tourné la tête,
# ni agi, ni parlé depuis afk-minutes est AFK (EterSleep ne l'attend pas pour passer la nuit).
activity:
  afk-minutes: 5
  # Étiquette <tag_afk> d'un joueur AFK (liste Tab d'EterTab : à placer dans tab.player-format) ; vide : jamais.
  afk-tag: " <gray>(AFK)"

teleport:
  # Attente avant de partir (bossbar, compte à rebours, particules). Moins pour un grade : eter.teleport.warmup.<secondes>
  # (la plus petite l'emporte). Aucune : eter.bypass.warmup.
  warmup: 3
  # Bouger de plus d'un demi-bloc pendant l'attente l'annule. Jamais pour un départ que le joueur n'a pas lancé
  # lui-même (tpa accepté par un autre) : il ne s'y attend pas.
  cancel-on-move: true
  # Ce qui annule l'attente : « combat » (un coup d'un joueur ou d'un monstre ; pas une chute, la faim, le feu), « all »
  # (tout dégât) ou « false » (rien). true = combat.
  cancel-on-damage: combat
  # Délai entre deux téléportations, partagé entre tous les serveurs. Moins pour un grade : eter.teleport.cooldown.<secondes>.
  cooldown: 30
  # Après une téléportation vers un joueur (ou depuis un autre serveur), ce nombre de secondes sans aucun dégât, tant que
  # le joueur ne frappe pas (arriver au milieu d'un combat). 0 = pas de protection.
  arrival-protection: 3
  # Après un coup donné ou reçu (joueur OU monstre), téléportation interdite pendant ce temps.
  combat-tag: 10

# ============================================================
#  Langue et couleurs (communes à tous les plugins Eter)
# ============================================================
#
#  Chaque plugin a ses messages dans plugins/<Plugin>/lang/ (format MiniMessage),
#  un fichier par langue avec le code Minecraft (en_us.yml, fr_fr.yml...).
#  Chaque joueur reçoit la langue de son jeu ; si elle n'existe pas, la langue
#  par défaut ci-dessous. Pour ajouter une langue : copier en_us.yml sous un
#  autre nom (ex : de_de.yml) et le traduire.

language:
  default: en_us

  # Préfixe de TOUS les messages des plugins Eter (EterHome, EterChat, EterEssential...),
  # pour qu'ils viennent tous du même nom. Format MiniMessage.
  prefix: '<gradient:#FF7A00:#FFB347><bold>Core</bold></gradient> <dark_gray>» '

  # Palette utilisable dans les messages de tous les plugins.
  # Couleur hexadécimale ("#FF8C1A") ou nommée (gray, gold...).
  colors:
    primary: '#FF7A00'   # titres (menu, bossbar)
    accent: '#FFA640'    # mots importants : noms, nombres, durées, commandes
    info: gray           # texte courant, qui ne doit pas ressortir (gris clair)
    error: '#FF5C5C'     # messages d'erreur
    success: '#5FD38D'   # petits repères seulement (bouton Confirmer, "(ici)")

# Actions du réseau (PNJ, menus, commandes : « eterjob:quests mineur », « eterlib:message ... ») : chaque plugin déclare
# les siennes ; /eterlib actions les liste, /eterlib action <ligne> en essaie une. debug : chaque action lancée est
# écrite dans la console.
actions:
  debug: false

# États (saignement, étourdissement...) des joueurs et des monstres, partagés par EterMob et les classes.
#  max-tenacity             : la ténacité (somme des bonus) ne réduit jamais un contrôle de plus que ça (0,8 = -80 %)
#  control-immunity-seconds : après un contrôle (étourdi, enraciné...), immunisé aux contrôles pendant ce temps
#  action-bar               : les états du joueur dans sa barre d'action (icône, piles, secondes)
states:
  max-tenacity: 0.8
  control-immunity-seconds: 3
  action-bar: true

# Combat : dégâts physiques (réduits par l'armure), magiques (par la résistance magique), bruts (rien). Réduction =
# défense / (défense + defense-constant) : 100 de défense = -50 %, 200 = -67 %. L'armure de Minecraft est convertie :
#  armor-per-point (points d'armure), toughness-per-point (robustesse), protection-per-level (Protection, toutes pièces),
#  specific-protection-per-level (Protection contre les projectiles / les explosions, contre ces coups-là).
#  protection-magic-per-level : résistance magique par niveau de Protection (la Protection vanilla réduit aussi la magie).
# Repères (physique) : fer ≈ 135 (-57 %), diamant ≈ 212 (-68 %), diamant ou netherite Protection IV ≈ 530-550 (-84 à -85 %),
# un peu sous le vanilla (~92 %) pour que les monstres restent dangereux. Magie : Protection IV sur 4 pièces ≈ 128 (-56 %).
# À revoir quand les objets à statistiques arriveront (base d'armure et de résistance magique).
# max : plafonds de l'esquive, de la chance de critique et des pénétrations. feedback : particules et sons (critique, esquive).
combat:
  defense-constant: 100
  vanilla:
    armor-per-point: 9
    toughness-per-point: 4
    protection-per-level: 20
    specific-protection-per-level: 25
    protection-magic-per-level: 8
  max:
    dodge: 0.6
    crit-chance: 1.0
    penetration: 0.9
  feedback: true
