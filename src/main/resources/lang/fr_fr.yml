  hours-minutes: "<hours> h <minutes> min"
  minutes-seconds: "<minutes> min <seconds> s"
  seconds: "<seconds> s"

inbox:
  title: "<primary>Tes notifications <dark_gray>(<count>)"
  line: "<dark_gray>[il y a <ago>] <reset><text>"
