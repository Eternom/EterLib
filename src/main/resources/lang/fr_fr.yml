  applied: "<success>État <accent><state></accent> posé sur <accent><target></accent>."
  refused: "<error><accent><state></accent> refusé sur <accent><target></accent> <dark_gray>(immunité, ténacité, créatif ou annulé)."
  cleared: "<success><accent><count></accent> état(s) retiré(s) de <accent><target></accent>."
