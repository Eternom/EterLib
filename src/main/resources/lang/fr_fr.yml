# Messages d'EterLib (textes communs à tous les plugins, téléportation, menus, durées), format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (EterLib/config.yml > language.colors) : <primary> <accent> <info> <error> <success>
#   <info> = texte courant gris clair, <accent> = mots importants en orange.
# Les valeurs entre <> comme <destination> sont remplies par le plugin. Pour afficher un "<", écrire \< entre 'guillemets simples'.
# Une clé absente reprend le texte intégré au plugin : tu peux ne garder que les lignes que tu modifies.
# Le préfixe des messages (« Core ») est commun à tous les plugins : EterLib/config.yml > language.prefix.

# Textes communs : repris par tous les plugins qui ne les redéfinissent pas.
command:
  players-only: "<error>Commande réservée aux joueurs."

error:
  generic: "<error>Une erreur est survenue, réessaie plus tard. <dark_gray>(réf. <ref>, à donner au staff)"

economy:
  unavailable: "<error>L'économie n'est pas disponible pour le moment."

dialog:
  cancel: "Annuler"

player:
  unknown: "<error>Joueur inconnu : <accent><player></accent>."

teleport:
  busy: "<error>Une téléportation est déjà en cours : attends qu'elle se termine."
  countdown-title: "<accent><bold><time>"
  countdown-still: "<info>Vers <accent><destination></accent> · ne bouge pas"
  countdown-free: "<info>Vers <accent><destination></accent>"
  warmup-start: "<info>Téléportation dans <accent><time>s</accent>."
  warmup-bar: "<info>Téléportation vers <accent><destination></accent> <dark_gray>· <accent><time>s"
  cancelled-bar: "<error>Téléportation annulée"
  cancelled-move: "<error>Téléportation annulée : tu as bougé."
  cancelled-damage: "<error>Téléportation annulée : tu as pris des dégâts."
  in-combat: "<error>Tu es en combat ! Attends <accent><time>s</accent> avant de te téléporter."
  cooldown: "<error>Attends <accent><time>s</accent> avant de te téléporter à nouveau."
  sending: "<info>Envoi vers <accent><server></accent>..."
  world-missing: "<error>Le monde de <accent><destination></accent> n'existe plus."
  target-gone: "<error><accent><destination></accent> n'est plus là."

