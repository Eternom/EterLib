# EterLib messages (texts shared by every plugin, teleport, menus, durations), MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = normal light gray text, <accent> = important words in orange.
# Values between <> such as <destination> are filled in by the plugin. To show a literal "<", write \< inside 'single quotes'.
# A missing key falls back to the plugin's built-in text: you only need to keep the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.

# Common texts: used by every plugin that does not redefine them.
command:
  players-only: "<error>This command can only be used by players."

error:
  generic: "<error>Something went wrong, please try again later. <dark_gray>(ref. <ref>, give it to the staff)"

economy:
  unavailable: "<error>The economy is not available right now."

dialog:
  cancel: "Cancel"

player:
  unknown: "<error>Unknown player: <accent><player></accent>."

teleport:
  busy: "<error>A teleport is already in progress: wait for it to end."
  countdown-title: "<accent><bold><time>"
  countdown-still: "<info>To <accent><destination></accent> · don't move"
  countdown-free: "<info>To <accent><destination></accent>"
  warmup-start: "<info>Teleporting in <accent><time>s</accent>."
  warmup-bar: "<info>Teleporting to <accent><destination></accent> <dark_gray>· <accent><time>s"
  cancelled-bar: "<error>Teleport cancelled"
  cancelled-move: "<error>Teleport cancelled: you moved."
  cancelled-damage: "<error>Teleport cancelled: you took damage."
  in-combat: "<error>You are in combat! Wait <accent><time>s</accent> before teleporting."
  cooldown: "<error>Wait <accent><time>s</accent> before teleporting again."
  sending: "<info>Sending you to <accent><server></accent>..."
  world-missing: "<error>The world of <accent><destination></accent> no longer exists."
  target-gone: "<error><accent><destination></accent> is no longer here."

combat:
  magic-first: "<info><accent>Magic damage!</accent> It is reduced by your <accent>magic resist</accent>, not your armor. Your statistics: <accent><click:run_command:'/combat'>/combat</click></accent>"
  player:
    header: "<primary>Your combat statistics"
    defense: "<dark_gray>▸ <info><stat>: <accent><value></accent> <dark_gray>(-<reduction> % damage)"
    line: "<dark_gray>▸ <info><stat>: <accent><value>"
    footer: "<dark_gray>Minecraft armor counts toward armor. The rest comes from items, states and later classes."
    numbers-on: "<success>Damage numbers shown <dark_gray>(only to you). /combat numbers to hide them."
    numbers-off: "<info>Damage numbers hidden."
    dodged: "Dodged"
    hint: "<dark_gray>/combat numbers: show the damage numbers of your hits."
    stat:
      armor: "Armor"
      magic_resist: "Magic resist"
      armor_pen: "Armor penetration"
      magic_pen: "Magic penetration"
      physical_bonus: "Bonus physical damage"
      magic_bonus: "Bonus magic damage"
      crit_chance: "Critical chance"
      crit_damage: "Bonus critical damage"
      dodge: "Dodge"
      tenacity: "Tenacity (shorter controls)"
  stats-header: "<info>Combat stats of <accent><target></accent>:"
  stats-line: "<dark_gray>▸ <accent><stat></accent> <white><value></white> <dark_gray>(<sources>)"
state:
  stats-usage: "<error>/eterlib stats [player]"
  usage: "<error>/eterlib state types | list [player] | apply <state> <power> <seconds> [player] | clear [player] <dark_gray>(no player: the entity you look at, else yourself)"
  unknown: "<error>Unknown state: <accent><state></accent> <dark_gray>(/eterlib state types)"
  no-target: "<error>Player not found on this server."
  applied: "<success>State <accent><state></accent> applied to <accent><target></accent>."
  refused: "<error><accent><state></accent> refused on <accent><target></accent> <dark_gray>(immunity, tenacity, creative or cancelled)."
  cleared: "<success><accent><count></accent> state(s) removed from <accent><target></accent>."
  type-line: "<dark_gray>▸ <accent><id></accent> <gray><category> · weight <weight> · <stacks> stack(s) max"
  list-header: "<info>States of <accent><target></accent>: <accent><count></accent> <dark_gray>(tenacity <tenacity>)"
  list-line: "<dark_gray>▸ <accent><id></accent> <gray>power <power> · <stacks> stack(s) · <time> s"
action:
  unknown: "<error>Unknown action on the network: <accent><action></accent>."
  unavailable: "<error>This action is not available on any server right now (<accent><action></accent>)."
  invalid: "Unreadable line (<line>): <reason>"
  is-condition: "<action> is a condition: write ?<action>"
  not-condition: "<action> is not a condition: remove the ?"
  missing-args: "Missing arguments: <usage>"
  error: "<error>You can't do that right now."
  cooldown: "<error>Wait <accent><time>s</accent>."
  check-error: "<error><problem>"
  usage: "<error>Usage: <accent>/eterlib actions [filter]</accent> or <accent>/eterlib action <line> [; line...]"
  list-title: "<info>Network actions (<accent><count></accent>):"
  list-line: "<dark_gray> ▸ <accent><usage></accent> <dark_gray>(<plugin>) <info><description>"
  list-line-remote: "<dark_gray> ▸ <info><usage> <dark_gray>(<plugin>, other server) <info><description>"

menu:
  page-of: "<dark_gray>Page <page>/<pages>"
  back: "<accent>« Back"
  back-lore: "<dark_gray>▸ <info><command>"
  back-previous: "<dark_gray>▸ <info>Back to the previous menu"
  close: "<error>Close"

time:
  days-hours: "<days>d <hours>h"
  hours-minutes: "<hours>h <minutes>min"
  minutes-seconds: "<minutes>min <seconds>s"
  seconds: "<seconds>s"

# /language: the language chosen by the player (whole network)
language:
  current: "<info>Text language: <accent><language>"
  choose: "<info>Choose: <click:run_command:'/language fr'><accent><u>[Français]</u></accent></click> <click:run_command:'/language en'><accent><u>[English]</u></accent></click> <click:run_command:'/language auto'><accent><u>[My game's]</u></accent></click>"
  set: "<success>✔</success> <info>Text language: <accent><language></accent> <dark_gray>(on the whole network)"
  name:
    fr_fr: "Français"
    en_us: "English"
    auto: "your game's"


inbox:
  title: "<primary>Your notifications <dark_gray>(<count>)"
  line: "<dark_gray>[<ago> ago] <reset><text>"
  empty: "<info>No notifications."
  unread: "<info>You got <accent><count> notification(s)</accent> while you were away: <accent><click:run_command:'/inbox'>[Read them]</click></accent>"
