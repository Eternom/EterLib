name: EterLib
version: '${version}'

main: fr.eternom.eterLib.EterLib
api-version: '26.2'
load: POSTWORLD
softdepend: [Vault, LuckPerms]
authors: [ NadTum ]
description: Socle commun des plugins Eter (base, Redis, langue, joueurs, téléportation).

commands:
  eterlib:
    description: Les actions du réseau (lister, essayer).
    usage: /eterlib <actions [filtre] | action <ligne> [; ligne...]>
    permission: eterlib.admin
  combat:
    description: Tes statistiques de combat (armure, résistance magique, critique, esquive...).
    usage: /combat
    permission: eterlib.combat
  inbox:
    description: Tes notifications (reçues en jeu ou pendant ton absence).
    usage: /inbox
    aliases: [boite]
    permission: eterlib.inbox

libraries:
  - com.zaxxer:HikariCP:7.0.2
  - redis.clients:jedis:6.2.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.6

permissions:
  eterlib.inbox:
    description: /inbox (ses notifications).
    default: true
  eterlib.combat:
    description: /combat (ses statistiques de combat).
    default: true
  eterlib.admin:
    description: /eterlib (lister et essayer les actions du réseau).
    default: op
  # Dispenses des règles de téléportation communes (EterLib/config.yml > teleport)
  eter.bypass.warmup:
    default: op
  eter.bypass.cooldown:
    default: op
  eter.bypass.combat:
    default: op
  eter.bypass:
    description: Toutes les dispenses de téléportation.
    default: op
    children:
      eter.bypass.warmup: true
      eter.bypass.cooldown: true
      eter.bypass.combat: true
  eter.vanish.see:
    description: 'Voir les joueurs invisibles (staff en vanish) : en jeu, dans les listes, dans le Tab.'
    default: op
